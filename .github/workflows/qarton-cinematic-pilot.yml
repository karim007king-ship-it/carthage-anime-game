name: QARTON Cinematic Pilot Contract
on:
  push:
    branches:
      - feature/qarton-cinematic-pilot-foundation-20261122
  pull_request:
    paths:
      - 'scripts/qarton-cinematic-pilot-contract.cjs'
      - 'tests/qarton-cinematic-pilot-contract-test.cjs'
      - 'examples/qarton-single-load-lab.html'
      - 'examples/qarton-single-load-scene.json'
      - 'tests/qarton-cinematic-scene-package-test.cjs'
      - 'scripts/qarton-timeline-player.js'
      - 'scripts/qarton-audio-cue-planner.js'
      - 'tests/qarton-audio-cue-planner-test.cjs'
      - 'scripts/qarton-audio-playback.js'
      - 'tests/qarton-audio-playback-test.cjs'
      - 'scripts/qarton-g4-legacy-presentation-adapter.cjs'
      - 'tests/qarton-g4-legacy-presentation-adapter-test.cjs'
      - 'tests/qarton-prepare-web-hook-contract-test.cjs'
      - 'tests/qarton-unified-id-registry-test.cjs'
      - 'tests/qarton-content-manifests-test.cjs'
      - 'tests/qarton-chapter-extraction-test.cjs'
      - 'tests/qarton-s1-source-parity-test.cjs'
      - 'tests/qarton-tn-locale-parity-test.cjs'
      - 'tests/fixtures/qarton-s1-texts.snapshot.json'
      - 'tests/fixtures/qarton-s1-original-scenes.snapshot.json'
      - 'game-content/**'
      - 'docs/qarton-unified-id-registry.proposal.json'
      - 'tests/qarton-timeline-player-test.cjs'
      - 'tests/qarton-cinematic-browser-wiring-test.cjs'
      - '.github/workflows/qarton-cinematic-pilot.yml'
      - 'scripts/prepare-web.cjs'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone pilot contract
        run: node --test tests/qarton-cinematic-pilot-contract-test.cjs tests/qarton-cinematic-scene-package-test.cjs tests/qarton-timeline-player-test.cjs tests/qarton-audio-cue-planner-test.cjs tests/qarton-audio-playback-test.cjs tests/qarton-g4-legacy-presentation-adapter-test.cjs tests/qarton-cinematic-browser-wiring-test.cjs tests/qarton-prepare-web-hook-contract-test.cjs tests/qarton-unified-id-registry-test.cjs tests/qarton-content-manifests-test.cjs tests/qarton-chapter-extraction-test.cjs tests/qarton-s1-source-parity-test.cjs tests/qarton-tn-locale-parity-test.cjs
      - name: Verify lab is isolated from production save keys
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('examples/qarton-single-load-lab.html','utf8'); if(/localStorage|sessionStorage|shiganshina-|__carthageSaveNow/.test(s)) process.exit(1); console.log('PASS: standalone lab does not access game saves')"
