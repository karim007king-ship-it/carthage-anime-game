name: QARTON Cinematic Browser Lab
on:
  push:
    branches:
      - feature/qarton-cinematic-pilot-foundation-20261122
  pull_request:
    paths:
      - 'examples/qarton-single-load-*'
      - 'scripts/qarton-timeline-player.js'
      - 'scripts/qarton-lab-server.cjs'
      - 'tests/qarton-cinematic-lab.spec.cjs'
      - '.github/workflows/qarton-cinematic-browser.yml'
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Start isolated test server
        run: node scripts/qarton-lab-server.cjs > /tmp/qarton-lab.log 2>&1 &
      - name: Run Chromium test
        run: node --test tests/qarton-cinematic-lab.spec.cjs
