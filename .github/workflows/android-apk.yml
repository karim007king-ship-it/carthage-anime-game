name: Build Carthage Android APK
# QARTON gameplay UI, intro-state regression, and story-flow checks are required before APK packaging.

on:
  workflow_dispatch:
  push:
    branches: [main, fix/new-game-qarton-home-regression, refactor/qarton-legacy-ui-isolation]
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "tests/**"
      - "scripts/**"
      - "styles/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main, fix/new-game-qarton-home-regression, refactor/qarton-legacy-ui-isolation]
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "tests/**"
      - "scripts/**"
      - "styles/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install stable Carthage signing key
        env:
          CARTHAGE_KEYSTORE_BASE64: ${{ secrets.CARTHAGE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${CARTHAGE_KEYSTORE_BASE64}" ]; then
            echo "::error::Add CARTHAGE_KEYSTORE_BASE64 under Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$CARTHAGE_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          chmod 600 "$HOME/.android/debug.keystore"
          echo "Stable Carthage debug signing key installed and validated."

      - name: Install JavaScript dependencies
        run: npm install

      - name: Run game integrity tests
        run: npm test

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify packaged game HTML
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const source = path.resolve('www/index.html');
          const assetsRoot = path.resolve('android/app/src/main/assets');
          if (!fs.existsSync(source)) throw new Error('Missing prepared web file: ' + source);
          function findPackaged(dir) {
            if (!fs.existsSync(dir)) return null;
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                const found = findPackaged(full);
                if (found) return found;
              } else if (entry.name === 'index.html' && full.split(path.sep).includes('public')) {
                return full;
              }
            }
            return null;
          }
          const packaged = findPackaged(assetsRoot);
          if (!packaged) throw new Error('Capacitor did not place index.html under Android assets/**/public/.');
          const src = fs.readFileSync(source);
          const dst = fs.readFileSync(packaged);
          const markers = [
            'carthage-startup-diagnostics',
            'carthage-startup-watchdog',
            'window.__CARTHAGE_MODULE_STARTED__=true',
            'window.__CARTHAGE_RENDER_REQUESTED__=true',
            'carthage-continue-last',
            'carthage-save-now',
            'carthage-cinematic-pilot-runtime',
            'carthage-save-transfer',
            'carthage-export-backup',
            'carthage-import-backup',
            'carthageCinematicLight',
            'carthageCinematicImpact',
            'carthage-fixed-home-runtime',
            'qarton-premium-home-runtime',
            'qarton-isolated-home-runtime',
            'qarton-home-screen',
            'qarton-premium-home-style',
            'qarton-design-system',
            'qarton-brand-row',
            'qarton-home-info'
          ];
          const html = dst.toString('utf8');
          const missing = markers.filter(marker => !html.includes(marker));
          if (missing.length) throw new Error('Packaged HTML is missing runtime markers: ' + missing.join(', '));
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');
          if (hash(src) !== hash(dst)) throw new Error('Packaged HTML differs from www/index.html; refusing to build a stale APK.');
          if (dst.length < 1000000) throw new Error('Packaged game HTML is unexpectedly small: ' + dst.length);
          console.log('PASS: packaged HTML verified at ' + packaged);
          console.log('Bytes: ' + dst.length + ' | SHA-256: ' + hash(dst));
          console.log('Startup diagnostics, watchdog, real story module, save and continue controls are present.');
          NODE

      - name: Apply Carthage launcher icon
        run: node scripts/apply-android-branding.cjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carthage-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
