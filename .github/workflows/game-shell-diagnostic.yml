name: Carthage Original Shell Diagnostic APK

on:
  push:
    branches: [diagnostic/webview-minimal]
    paths:
      - "diagnostics/prepare-game-shell.cjs"
      - ".github/workflows/game-shell-diagnostic.yml"

permissions:
  contents: read

jobs:
  build-shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Prepare original HTML shell
        run: node diagnostics/prepare-game-shell.cjs
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build shell diagnostic APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload shell diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: carthage-original-shell-diagnostic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
