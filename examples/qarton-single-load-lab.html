<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QARTON TEST LAB — حمولة واحدة</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#100c0d;color:#f7e8ce}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center}
main{width:min(100%,760px);padding:20px}header{color:#e7bb65;letter-spacing:.14em;text-align:center}
h1{text-align:center;font-size:clamp(26px,5vw,40px);margin:12px 0}
p{line-height:1.8}.stage{position:relative;overflow:hidden;height:280px;border:1px solid #98753c;border-radius:18px;background:linear-gradient(#3b2026 0 48%,#614b40 49% 65%,#292f38 66%);isolation:isolate}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,#f0c57c22 50%,transparent 75%);animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{transform:translateX(28%)}}.road{position:absolute;bottom:0;left:18%;width:64%;height:40%;clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);background:#665047}
.stage[data-reduced-motion=true]::before,.stage[data-reduced-motion=true] .wagon{animation:none!important}.stage[data-shot=medium]{box-shadow:inset 0 0 40px #e6b76d25}.bridge,.clinic{position:absolute;bottom:28%;padding:12px 18px;background:#171317b8;border:1px solid #cba25d;border-radius:10px}
.bridge{left:6%}.clinic{right:6%}.wagon{position:absolute;bottom:13%;left:40%;font-size:62px;animation:drift 4s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(-5px)}}.subtitle{margin:12px 0;min-height:60px;padding:12px;background:#20171b;border-radius:10px}
.controls,.choices{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{border:1px solid #b88e48;border-radius:10px;background:#332027;color:#fff0d6;padding:12px 14px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff}
button[disabled]{opacity:.5;cursor:not-allowed}.choices button{flex:1 1 180px}#result{white-space:pre-line;color:#f6d997;min-height:28px}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header>QARTON · CULTURE • POWER • CINEMA</header>
<h1>حمولة واحدة</h1>
<p>الفصل 27 — نموذج عرض سينمائي مستقل، لا يغيّر حفظ اللعبة ولا يفتح فصلًا جديدًا.</p>
<div class="stage" role="img" aria-label="عربة بين الجسر والعيادة">
<div class="road"></div><div class="bridge">🌉 الجسر</div><div class="clinic">🏥 العيادة</div><div class="wagon" aria-hidden="true">🛒</div>
</div>
<div class="subtitle" id="subtitle" aria-live="polite">نور: هذه آخر حمولة نجموا نخرجوها اليوم.</div>
<div class="controls">
<button type="button" id="play">▶ تشغيل</button><button type="button" id="pause">⏸ إيقاف</button><button type="button" id="replay">↻ إعادة</button><label for="seek">تقدّم المشهد</label><input id="seek" type="range" min="0" max="21000" step="100" value="0" aria-label="تقدّم المشهد"><output id="clock" for="seek">0:00</output><button type="button" id="reduce">تقليل الحركة</button>
</div>
<p>اختار شنوّة يصير للحمولة في التجربة فقط:</p>
<div class="choices">
<button type="button" data-choice="prioritizeBridge">الحمولة للجسر</button>
<button type="button" data-choice="prioritizeClinic">الحمولة للعيادة</button>
<button type="button" data-choice="splitWithLimits">نقسم الحمولة</button>
</div>
<div id="result" role="status" aria-live="polite"></div>
</main>
<script src="../scripts/qarton-timeline-player.js"></script>
<script>
(()=>{'use strict';
const outcomes={
 prioritizeBridge:'الجسر: إصلاح بدأ. العيادة: غطاء مؤقت.',
 prioritizeClinic:'العيادة: سقف أقوى. الجسر: الإصلاح تأجّل.',
 splitWithLimits:'الجسر: ممر مشاة فقط. العيادة: حماية جزئية.'
};
const subtitle=document.getElementById('subtitle'),result=document.getElementById('result');
const stage=document.querySelector('.stage'),wagon=document.querySelector('.wagon');
const seek=document.getElementById('seek'),clock=document.getElementById('clock');
let player=null,frameId=null,lastFrame=null;
let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function stopLoop(){if(frameId!==null){cancelAnimationFrame(frameId);frameId=null;}lastFrame=null;}
function frame(t){if(!player||!player.state.playing){stopLoop();return;}if(lastFrame!==null)player.tick(Math.max(0,Math.min(250,t-lastFrame)));lastFrame=t;if(player.state.playing)frameId=requestAnimationFrame(frame);else stopLoop();}
function startLoop(){stopLoop();frameId=requestAnimationFrame(frame);}
function render(view){
 seek.value=String(view.positionMs);clock.textContent=Math.floor(view.positionMs/60000)+':'+String(Math.floor(view.positionMs/1000)%60).padStart(2,'0');
 stage.dataset.reducedMotion=String(reduced);
 const d=view.dialogue;
 subtitle.textContent=d?({nour:'نور',ryan:'ريان',lina:'لينا'}[d.speaker]||d.speaker)+': '+d.text:'...';
 const shot=view.camera?.shot||'wide';
 stage.dataset.shot=shot;
 const movement=reduced?0:Math.min(12,view.positionMs/2200);
 wagon.style.transform='translateX('+movement+'px) scale('+(reduced?1:shot==='medium'?1.12:1)+')';
 document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=!view.choices;});
}
async function init(){
 if(!window.QartonTimelinePlayer){result.textContent='تعذّر تحميل مشغّل المشهد.';return;}
 try{
  const response=await fetch('./qarton-single-load-scene.json');
  if(!response.ok)throw Error('HTTP '+response.status);
  const scene=await response.json();
  player=window.QartonTimelinePlayer.createTimelinePlayer(scene,render);
  document.getElementById('play').addEventListener('click',()=>{player.play();startLoop();});
  document.getElementById('pause').addEventListener('click',()=>{player.pause();stopLoop();});
  document.getElementById('replay').addEventListener('click',()=>{player.replay();result.textContent='';startLoop();});
  seek.addEventListener('input',()=>{player.pause();stopLoop();player.seek(Number(seek.value));});
  document.getElementById('reduce').addEventListener('click',()=>{reduced=!reduced;player.pause();stopLoop();player.seek(player.state.positionMs);result.textContent=reduced?'تقليل الحركة مفعل':'تقليل الحركة معطل';});
  document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{
   if(!player.state.positionMs||player.state.positionMs<20500)return;
   player.pause();stopLoop();result.textContent=outcomes[b.dataset.choice]||'اختيار غير معروف';
  }));
 }catch(err){result.textContent='يلزم تشغيل التجربة عبر خادم ويب محلي أو GitHub Pages، موش فتح الملف مباشرة. '+err.message;}
}
window.addEventListener('pagehide',()=>{stopLoop();if(player)player.destroy();});
init();
})();
</script>
</body>
</html>
